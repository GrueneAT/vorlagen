# Visual-diff tolerance for Postkarte A6 – Variante 2.
# See docs/diff-tolerance.md for schema.
#
# 2-page A6 postcard. The baseline is this template's own template.sla
# render (repo convention: baseline = template.sla render, not preview.pdf),
# so both pages diff at 0.0000%. No per-page overrides needed.
#
# fuzz_pct=5 is the project-wide cap (issue prompt: "max fuzz is 5%").
visual_diff:
  max_pixel_mismatch_pct: 1.0
  fuzz_pct: 5.0
